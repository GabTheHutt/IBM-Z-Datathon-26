<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Log in | Inter Body Manager</title>
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-intro">
            <a class="auth-brand" href="login.html"><span class="brand-mark">IBM</span><span>Inter Body Manager</span></a>
            <div><p class="section-kicker">Your health, connected</p><h1>Understand your body.<br><span>Move with purpose.</span></h1><p>Track the signals that help you feel and perform at your best.</p></div>
        </section>
        <section class="auth-card" aria-labelledby="login-heading">
            <p class="section-kicker">Welcome back</p>
            <h2 id="login-heading">Log in to IBM</h2>
            <p class="auth-subtitle">Enter your email and password to continue to your dashboard.</p>
            <form id="login-form" class="auth-form">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <div class="auth-options"><label class="remember-label"><input type="checkbox"> Remember me</label><a href="forgot-password.html">Forgot password?</a></div>
                <button class="save-button" type="submit">Log in</button>
                <p class="form-message" role="status"></p>
            </form>
            <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
        </section>
    </main>
</body>
</html>
