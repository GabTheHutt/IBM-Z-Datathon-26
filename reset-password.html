<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="auth.js" defer></script>
    <title>Reset password | Inter Body Manager</title>
</head>
<body class="auth-page">
    <main class="auth-layout auth-layout-centered">
        <section class="auth-card">
            <a class="auth-brand auth-brand-dark" href="login.html"><span class="brand-mark">IBM</span><span>Inter Body Manager</span></a>
            <p class="section-kicker">Account recovery</p><h2>Set a new password</h2><p class="auth-subtitle">Choose a password between 8 and 15 characters.</p>
            <form id="reset-form" class="auth-form">
                <label for="reset-password">New password</label><input id="reset-password" name="password" type="password" minlength="8" maxlength="15" autocomplete="new-password" required>
                <label for="reset-confirmation">Confirm new password</label><input id="reset-confirmation" name="passwordConfirmation" type="password" minlength="8" maxlength="15" autocomplete="new-password" required>
                <button class="save-button" type="submit">Reset password</button><p class="form-message" role="status"></p>
            </form>
        </section>
    </main>
</body>
</html>
