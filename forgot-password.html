<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="auth.js" defer></script>
    <title>Forgot password | Inter Body Manager</title>
</head>
<body class="auth-page">
    <main class="auth-layout auth-layout-centered">
        <section class="auth-card">
            <a class="auth-brand auth-brand-dark" href="login.html"><span class="brand-mark">IBM</span><span>Inter Body Manager</span></a>
            <p class="section-kicker">Account recovery</p><h2>Forgot your password?</h2><p class="auth-subtitle">Enter your email and we’ll send a secure reset link.</p>
            <form id="forgot-form" class="auth-form">
                <label for="forgot-email">Email address</label><input id="forgot-email" name="email" type="email" autocomplete="email" required>
                <button class="save-button" type="submit">Email reset link</button><p class="form-message" role="status"></p>
            </form>
            <p class="auth-switch"><a href="login.html">Back to log in</a></p>
        </section>
    </main>
</body>
</html>
